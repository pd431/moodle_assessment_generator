name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    name: ${{ matrix.moodle-branch }} / PHP ${{ matrix.php }} / ${{ matrix.database }}
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
      mariadb:
        image: mariadb:${{ matrix.mariadb }}
        env:
          MYSQL_USER: root
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_CHARACTER_SET_SERVER: utf8mb4
          MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        include:
          # Moodle 4.5 LTS: PHP 8.1 to 8.3; MariaDB 10.6.7+, PostgreSQL 13+.
          - { moodle-branch: MOODLE_405_STABLE, php: '8.1', database: pgsql, postgres: '16', mariadb: '10.11' }
          - { moodle-branch: MOODLE_405_STABLE, php: '8.1', database: mariadb, postgres: '16', mariadb: '10.11' }
          - { moodle-branch: MOODLE_405_STABLE, php: '8.3', database: pgsql, postgres: '16', mariadb: '10.11' }
          - { moodle-branch: MOODLE_405_STABLE, php: '8.3', database: mariadb, postgres: '16', mariadb: '10.11' }
          # Moodle 5.3: PHP 8.3 to 8.4; MariaDB 11.4+, PostgreSQL 17+.
          - { moodle-branch: MOODLE_503_STABLE, php: '8.3', database: pgsql, postgres: '17', mariadb: '11.4' }
          - { moodle-branch: MOODLE_503_STABLE, php: '8.3', database: mariadb, postgres: '17', mariadb: '11.4' }
          - { moodle-branch: MOODLE_503_STABLE, php: '8.4', database: pgsql, postgres: '17', mariadb: '11.4' }
          - { moodle-branch: MOODLE_503_STABLE, php: '8.4', database: mariadb, postgres: '17', mariadb: '11.4' }

    steps:
      - name: Check out the plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.extensions }}
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install Moodle and the plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP copy/paste detector
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcpd

      - name: PHP mess detector
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle code checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat features
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome --scss-deprecations

      - name: Mark cancelled jobs as failed
        if: ${{ cancelled() }}
        run: exit 1
